mily="Menlo, Monaco, monospace" font-size="15" fill="#CDD6F4" font-weight="400">   · 小杯鲜萃咖啡     ¥9.5   15kcal  P1g</text><text x="36" y="494" font-family="Menlo, Monaco, monospace" font-size="15" fill="#CDD6F4" font-weight="700">   合计 ¥39.4 | 772kcal | 蛋白49g</text><text x="36" y="546" font-family="Menlo, Monaco, monospace" font-size="15" fill="#6C7086" font-weight="400">—— 营养数据来自麦当劳官方接口，仅供参考</text>
